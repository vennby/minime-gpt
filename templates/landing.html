{% extends 'base.html' %}

{% block title %}MinimēGPT - Distraction-Free Writing{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
{% endblock %}

{% block content %}
<main class="landing-main">
  <div class="landing-center">
    <h1 class="brand-name">MinimēGPT</h1>
    
    <div class="action-buttons">
      {% if current_user %}
      <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Go to Dashboard</a>
      {% else %}
      <a class="btn btn-primary" href="{{ url_for('login') }}">Get Started</a>
      <a class="btn btn-secondary" href="{{ url_for('register') }}">Sign Up</a>
      {% endif %}
    </div>
  </div>
</main>
{% endblock %}
