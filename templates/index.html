{% extends 'base.html' %} {% block head %}
<link rel="stylesheet" href="static/css/index.css" />
<link
  href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
  rel="stylesheet"
/>
{% endblock %} {% block content %}
<nav>
  <h1>M</h1>
</nav>

<div class="header">
  <div class="file-name" contenteditable="true">Untitled document</div>
  <div class="toolbar-spacer"></div>
  <div class="toolbar-actions">
    <button class="toolbar-btn">Share</button>
    <button class="toolbar-btn primary">+ New</button>
  </div>
</div>

<div class="text-editor">
  <div class="editor-container" id="editor-container">
    <div class="page-wrapper" data-page="0">
      <div class="editor-page" id="editor-0"></div>
    </div>
  </div>
</div>

<div class="page-indicator">
  <span id="current-page">1</span> / <span id="total-pages">1</span>
</div>
{% endblock %} {% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="static/js/index.js"></script>
{% endblock %}
